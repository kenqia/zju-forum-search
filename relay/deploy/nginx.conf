# Include within an HTTPS server block after installing the certificate.
# API hostname: api.kenqia.top. Do not log credentials or query content.
location / {
    access_log off;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 70s;
    proxy_send_timeout 10s;
}
